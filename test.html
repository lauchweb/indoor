<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Andemik</title>

  <meta
    name="description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >

  <link rel="canonical" href="https://site.com/">
  <link rel="icon" href="/favicon.ico">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Andemik">
  <meta
    property="og:description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >
  <meta property="og:url" content="https://site.com/">
  <meta property="og:image" content="https://site.com/og.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Andemik">
  <meta
    name="twitter:description"
    content="Andemik — fieldwork, laboratory research, and the conservation of endemic flora."
  >
  <meta name="twitter:image" content="https://site.com/og.jpg">

  <style>
    :root {
      --background: #ffffff;
      --text: #171717;

      --page-margin: clamp(20px, 4vw, 64px);
      --image-gap: clamp(16px, 2vw, 32px);
      --label-gap: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;

      background: var(--background);
      color: var(--text);

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
    }

    .site {
      min-height: 100svh;

      display: grid;
      grid-template-rows: auto 1fr auto;

      padding:
        var(--page-margin)
        var(--page-margin)
        calc(var(--page-margin) * 0.8);
    }

    .header {
      display: flex;
      align-items: flex-start;
    }

    .wordmark {
      color: var(--text);

      font-size: 14px;
      line-height: 1;

      font-weight: 400;
      letter-spacing: 0.08em;

      text-decoration: none;
    }

    main {
      display: flex;
      align-items: center;
      justify-content: center;

      padding-block: 8vh;
    }

    .sections {
      width: 100%;
      max-width: 1100px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

      gap: var(--image-gap);

      margin-inline: auto;
    }

    .section {
      display: block;
      min-width: 0;

      color: var(--text);
      text-align: center;

      text-decoration: none;
    }

    .image-wrap {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .section img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .section-label {
      display: inline-block;

      margin-top: var(--label-gap);

      color: var(--text);

      font-size: 11px;
      line-height: 1.2;

      font-weight: 400;
      letter-spacing: 0.10em;

      text-transform: uppercase;

      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    .wordmark:focus-visible,
    .section:focus-visible,
    .footer a:focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 4px;
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;

      align-items: end;

      color: var(--text);

      font-size: 10px;
      line-height: 1.2;

      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .footer-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .footer a {
      color: var(--text);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .footer-dot {
      user-select: none;
    }

    @media (max-width: 600px) {
      :root {
        --page-margin: 20px;
        --image-gap: 16px;
        --label-gap: 11px;
      }

      .wordmark {
        font-size: 14px;
      }

      .sections {
        max-width: none;
      }

      main {
        padding-block: 6vh;
      }

      .section-label {
        font-size: 11px;
      }

      .footer {
        font-size: 10px;
      }

      .footer-right {
        gap: 8px;
      }
    }

    @media (max-width: 400px) {
      .footer {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .footer-right {
        justify-content: flex-start;
      }
    }

    @media (max-width: 340px) {
      :root {
        --page-margin: 16px;
        --image-gap: 12px;
      }

      .wordmark {
        font-size: 13px;
      }

      .section-label {
        font-size: 10px;
      }

      .footer {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="site">

    <header class="header">
      <a
        class="wordmark"
        href="/"
        aria-label="Andemik home"
      >
        ANDEMIK
      </a>
    </header>

    <main>
      <nav
        class="sections"
        aria-label="Andemik sections"
      >

        <a
          class="section"
          href="https://field.site.com"
        >
          <div class="image-wrap">
            <img
              src="/field.jpg"
              alt=""
              loading="eager"
              decoding="async"
            >
          </div>

          <span class="section-label">FIELD</span>
        </a>

        <a
          class="section"
          href="https://lab.site.com"
        >
          <div class="image-wrap">
            <img
              src="/lab.jpg"
              alt=""
              loading="eager"
              decoding="async"
            >
          </div>

          <span class="section-label">LAB</span>
        </a>

      </nav>
    </main>

    <footer class="footer">

      <div class="footer-left">
        <span>© 2026</span>
        <span>ANDEMIK</span>
      </div>

      <nav
        class="footer-right"
        aria-label="Legal"
      >
        <a href="/terms.html">Terms</a>

        <span
          class="footer-dot"
          aria-hidden="true"
        >·</span>

        <a href="/privacy.html">Privacy</a>
      </nav>

    </footer>

  </div>

</body>
</html>
